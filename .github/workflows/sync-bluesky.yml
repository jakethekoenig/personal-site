name: Sync Bluesky posts

on:
        schedule:
                # Offset from the top of the hour to reduce GitHub Actions congestion.
                - cron: '2-59/5 * * * *'
        workflow_dispatch:
                inputs:
                        deploy_without_changes:
                                description: Re-run the site deployment even if no new post is found
                                required: false
                                default: false
                                type: boolean

permissions:
        contents: write
        actions: write

concurrency:
        group: bluesky-shortform-sync
        cancel-in-progress: false

jobs:
        sync:
                runs-on: ubuntu-latest
                steps:
                        - name: Check out website source
                          uses: actions/checkout@v4
                          with:
                                  fetch-depth: 0

                        - name: Import new Bluesky posts
                          id: import
                          continue-on-error: true
                          env:
                                  TWITTER_CROSSPOST_ENABLED: "true"
                                  TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
                                  TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
                                  TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
                                  TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
                                  TWITTER_USERNAME: ja3k_
                                  MASTODON_CROSSPOST_ENABLED: "true"
                                  MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
                                  MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
                                  THREADS_CROSSPOST_ENABLED: "true"
                                  THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
                                  THREADS_USERNAME: ${{ secrets.THREADS_USERNAME }}
                                  FARCASTER_CROSSPOST_ENABLED: "true"
                                  NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
                                  FARCASTER_SIGNER_UUID: ${{ secrets.FARCASTER_SIGNER_UUID }}
                                  FARCASTER_USERNAME: ${{ secrets.FARCASTER_USERNAME }}
                          run: |
                                  python3 -m pip install --quiet --requirement scripts/social/requirements.txt
                                  python3 scripts/social/sync_bluesky.py

                        - name: Check for imported posts
                          id: changes
                          if: always()
                          shell: bash
                          run: |
                                  changes="$(git status --porcelain -- .github/bluesky-sync-state.json data/short content/short)"
                                  if [[ -n "$changes" ]]; then
                                          echo "changed=true" >> "$GITHUB_OUTPUT"
                                          echo "$changes"
                                  else
                                          echo "changed=false" >> "$GITHUB_OUTPUT"
                                  fi

                        - name: Upload Bluesky media
                          if: always() && steps.changes.outputs.changed == 'true'
                          env:
                                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                                  AWS_DEFAULT_REGION: us-west-2
                          run: aws s3 sync nongenerated/asset/bluesky s3://ja3k.com/asset/bluesky --size-only

                        - name: Commit and push imported posts
                          if: always() && steps.changes.outputs.changed == 'true'
                          shell: bash
                          run: |
                                  git config user.name "github-actions[bot]"
                                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                                  git add .github/bluesky-sync-state.json data/short content/short
                                  git commit -m "Sync Bluesky posts"
                                  git pull --rebase origin master
                                  git push origin HEAD:master

                        - name: Trigger website deployment
                          if: always() && (steps.changes.outputs.changed == 'true' || inputs.deploy_without_changes == true)
                          env:
                                  GH_TOKEN: ${{ github.token }}
                          run: gh workflow run deploy.yml --ref master

                        - name: Report an incomplete import
                          if: always() && steps.import.outcome == 'failure'
                          run: exit 1
