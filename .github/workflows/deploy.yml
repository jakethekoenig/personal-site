name: Deploy website
on:
        push:
                branches:
                        - master
jobs:
        sync:
                runs-on: ubuntu-latest
                steps:
                        - name: Check out website source
                          uses: actions/checkout@v4
                          with:
                                  fetch-depth: 0
                        - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
                        - name: Check for comment Lambda changes
                          id: comment_lambda_changes
                          env:
                                  BEFORE_SHA: ${{ github.event.before }}
                                  AFTER_SHA: ${{ github.sha }}
                          run: |
                                  if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- backend/catchcomments; then
                                          echo "changed=true" >> "$GITHUB_OUTPUT"
                                  else
                                          echo "changed=false" >> "$GITHUB_OUTPUT"
                                  fi
                        - run: ./scripts/build/build_live.sh
                        - run: ./scripts/deploy/update.sh
                          env:
                                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                                  AWS_DEFAULT_REGION: 'us-west-2'
                        - name: Deploy comment Lambda
                          if: steps.comment_lambda_changes.outputs.changed == 'true'
                          run: ./scripts/one_off/legacy_comments/deploy_lambda.sh
                          env:
                                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                                  AWS_DEFAULT_REGION: 'us-east-2'
